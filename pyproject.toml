[project]
name = "mage-flow-mlx"
version = "0.1.0"
description = "Mage-Flow (4B MMDiT) ported to MLX for Apple Silicon"
requires-python = ">=3.11"
dependencies = [
    "mlx>=0.32",
    "mlx-lm>=0.31",
    "safetensors>=0.4",
    "huggingface-hub>=0.23",
    "pillow>=10.0",
    "numpy>=1.24",
    "regex>=2023.12",
    "platformdirs>=4.0",
    "toml>=0.10.2",
    "piexif>=1.1.3",
    "opencv-python>=4.10.0",
    "protobuf>=4.25.0",
    "fonttools>=4.60.2",
    "tqdm>=4.66.5",
    "urllib3>=2.6.0",
]

[project.scripts]
mage-flow-generate = "generate:main"

[tool.uv]
dev-dependencies = [
    "torch>=2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
